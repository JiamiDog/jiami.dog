name: Sync published articles

on:
  schedule:
    # 每天 UTC 02:30 / 北京时间 10:30 执行。
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-published-articles
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned converter
        run: python -m pip install --requirement requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Sync public content
        run: python scripts/sync_content.py --repository-root .

      - name: Commit generated changes
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- README.md content/INDEX.md content/posts data/articles.json data/sync-state.json)" ]]; then
            echo "No published-content changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md content/INDEX.md content/posts data/articles.json data/sync-state.json
          git commit -m "chore(content): sync published articles"
          git push
