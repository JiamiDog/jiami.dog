title: "[问答] "
body:
  - type: markdown
    attributes:
      value: |
        请尽量描述目标和已经尝试的步骤。涉及安全漏洞、账号或个人数据时，请不要在公开讨论中披露。
  - type: input
    id: related_url
    attributes:
      label: 相关页面
      description: 如果问题来自某篇文章，请提供原文或镜像地址；没有可留空。
      placeholder: https://jiami.dog/example/
  - type: textarea
    id: goal
    attributes:
      label: 你想完成什么
      description: 用一两句话说明目标和使用场景。
    validations:
      required: true
  - type: textarea
    id: attempts
    attributes:
      label: 已尝试的方法
      description: 说明操作步骤、实际结果和完整但已脱敏的错误信息。
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 问题领域
      options:
        - 文章内容理解
        - 工具或服务使用
        - 网站与镜像使用
        - 联盟营销与出海业务
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: confirmations
    attributes:
      label: 发布前确认
      options:
        - label: 我没有公开密码、Cookie、令牌、个人资料或其他秘密。
          required: true
