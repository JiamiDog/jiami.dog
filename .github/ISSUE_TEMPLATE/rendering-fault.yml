name: 镜像渲染故障
description: 报告 Markdown 中正文、图片、链接、表格或视频呈现异常。
title: "[渲染] "
labels:
  - rendering
  - needs-triage
body:
  - type: markdown
    attributes:
      value: |
        请对比 WordPress 源站与 GitHub 镜像。若源站本身也存在同样问题，请改在 Discussions 的“纠错与建议”分类说明。
  - type: input
    id: mirror_url
    attributes:
      label: GitHub 镜像地址
      placeholder: https://github.com/JiamiDog/jiami.dog/blob/main/content/posts/...
    validations:
      required: true
  - type: input
    id: source_url
    attributes:
      label: 源站文章地址
      placeholder: https://jiami.dog/example/
    validations:
      required: true
  - type: dropdown
    id: affected_part
    attributes:
      label: 异常部分
      multiple: true
      options:
        - 正文或标题层级
        - 图片
        - 链接
        - 表格
        - 视频或嵌入内容
        - 代码块
        - 其他
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤和实际结果
      description: 说明打开哪个位置、做了什么，以及出现的异常。可直接拖入已遮盖隐私的截图。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 说明源站中对应内容的正确呈现方式。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 查看环境
      description: 如问题与设备有关，请填写浏览器、系统或 GitHub App；否则可留空。
      placeholder: 例如 Chrome 版本、Windows 11
  - type: checkboxes
    id: confirmations
    attributes:
      label: 提交前确认
      options:
        - label: 我已确认源站显示正常，而 GitHub 镜像显示异常。
          required: true
        - label: 我没有在表单或截图中泄露令牌、Cookie、个人数据或其他秘密。
          required: true
